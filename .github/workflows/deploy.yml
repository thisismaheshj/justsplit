name: Deploy to GitHub Pages

# Runs on every push to main, and can also be triggered by hand from the
# Actions tab in GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions GitHub Pages needs to publish the built site.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, cancel the older run rather than deploying it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        # GITHUB_PAGES tells vite.config.ts to serve from /justsplit/
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          # Both are public values baked into the bundle; row-level security is
          # what protects the data, not secrecy of the anon key. Stored as repo
          # secrets only to keep the project URL out of the source.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Add SPA fallback
        # GitHub Pages serves static files only, so a hard load of a client
        # route like /auth/callback would 404. Pages serves 404.html for any
        # unmatched path, so making it a copy of index.html hands the URL to
        # the router instead. Without this, Google OAuth cannot come back.
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
