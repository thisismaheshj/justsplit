<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <!-- iOS ignores the manifest's icons; this is what "Add to Home Screen" uses. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JustSplit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAF9" />
    <title>JustSplit — Simple expense splitting</title>
    <meta name="description" content="JustSplit tracks shared expenses with friends: who paid, who owes whom, and how to settle up." />
    <!-- Geist is on every screen; fetching it alongside the CSS rather than
         after it saves a round trip before text settles into it. -->
    <link rel="preload" href="/src/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>JustSplit tracks shared expenses with friends: who paid, who owes whom, and how to settle up. It needs JavaScript to run.</p>
      <p><a href="privacy.html">Privacy policy</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
