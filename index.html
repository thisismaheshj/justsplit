<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <!-- iOS ignores the manifest's icons; this is what "Add to Home Screen" uses. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JustSplit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAF9" />
    <title>JustSplit — Simple expense splitting</title>
    <meta name="description" content="JustSplit tracks shared expenses with friends: who paid, who owes whom, and how to settle up." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint: text shows in the system
         font straight away and swaps to Geist when it arrives. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>JustSplit tracks shared expenses with friends: who paid, who owes whom, and how to settle up. It needs JavaScript to run.</p>
      <p><a href="privacy.html">Privacy policy</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
